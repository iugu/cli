name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write   # the GitHub Release and its assets
  id-token: write   # cosign keyless signing (Sigstore, GitHub OIDC)
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fine-grained token with Contents: write on iugu/homebrew-tap and iugu/scoop-bucket only
          # (the workflow's own GITHUB_TOKEN cannot write to other repositories).
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
  # @iugu/cli is published with npm Trusted Publishing (OIDC — no npm token in this repository). The first
  # version was published by hand; once the trusted publisher (GitHub Actions, iugu/cli, release.yml) is
  # configured on npmjs.com, set the repository variable NPM_TRUSTED_PUBLISHING=true and every tag publishes.
  npm:
    needs: goreleaser
    if: vars.NPM_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    permissions: { id-token: write, contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: https://registry.npmjs.org }
      - run: npm install -g npm@latest   # trusted publishing needs npm >= 11.5.1
      - run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd npm && npm version "$VERSION" --no-git-tag-version
          IUGU_CLI_SKIP_DOWNLOAD=1 npm publish --access public
