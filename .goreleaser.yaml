# goreleaser v2 — `make snapshot` builds locally without publishing; a `v*` tag on `main` publishes through CI
# (.github/workflows/release.yml). Releases are signed with cosign (keyless, GitHub OIDC), ship an SBOM per archive
# and a checksums file that install.sh, the Homebrew cask and the npm shim verify against. The cask and the Scoop
# manifest live in other repositories (iugu/homebrew-tap, iugu/scoop-bucket): pushing there needs TAP_GITHUB_TOKEN,
# a fine-grained token with Contents: write on those two repositories only (repository secret of iugu/cli).
version: 2

project_name: iugu

git:
  ignore_tags: ["backup/*"]

before:
  hooks:
    - go mod tidy
    - ./scripts/completions.sh

builds:
  - id: iugu
    main: ./cmd/iugu
    binary: iugu
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/iugu/cli/internal/cli.Version={{ .Version }}
      - -X github.com/iugu/cli/internal/cli.Commit={{ .ShortCommit }}
      - -X github.com/iugu/cli/internal/cli.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - src: build/completions/*
        dst: completions
        strip_parent: true

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    args: [sign-blob, "--yes", "--output-certificate=${certificate}", "--output-signature=${signature}", "${artifact}"]
    artifacts: checksum

snapshot:
  version_template: "{{ incpatch .Version }}-next+{{ .ShortCommit }}"

changelog:
  use: git
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]

release:
  github:
    owner: iugu
    name: cli
  draft: false
  prerelease: auto
  footer: |
    ## Install
    ```
    brew install iugu/tap/iugu
    curl -fsSL https://raw.githubusercontent.com/iugu/cli/main/install.sh | sh
    scoop bucket add iugu https://github.com/iugu/scoop-bucket && scoop install iugu
    npx @iugu/cli --help
    ```
    Verify: `cosign verify-blob --certificate checksums.txt.pem --signature checksums.txt.sig --certificate-identity-regexp 'github.com/iugu/cli' --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt`

homebrew_casks:
  - name: iugu
    repository:
      owner: iugu
      name: homebrew-tap
      branch: main
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Casks
    skip_upload: auto
    homepage: https://github.com/iugu/cli
    description: Platform 2 Console CLI for developers and their AI agents
    license: MIT
    binaries: [iugu]
    completions:
      bash: completions/iugu.bash
      zsh: completions/_iugu
      fish: completions/iugu.fish
    # The binaries are not notarized by Apple yet; Homebrew quarantines cask downloads and Gatekeeper would refuse
    # the binary. Declarative steps (Homebrew 7): the legacy `postflight` block goreleaser's `hooks` render is
    # deprecated and prints a warning on every install. `{{staged_path}}` is Homebrew's install-time token; the
    # braces are escaped because goreleaser runs this block through Go's text/template first. goreleaser puts a
    # custom_block at the top of the cask, which `brew style` flags as stanza order — cosmetic; the install is clean.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{" }}staged_path{{ "}}" }}/iugu"], must_succeed: false
        end
      end

scoops:
  - name: iugu
    repository:
      owner: iugu
      name: scoop-bucket
      branch: main
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    skip_upload: auto
    homepage: https://github.com/iugu/cli
    description: Platform 2 Console CLI for developers and their AI agents
    license: MIT
