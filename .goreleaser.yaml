# goreleaser v2 — `make snapshot` builds locally without publishing; tags on `main` publish through CI.
# Releases are signed with cosign (keyless, GitHub OIDC), ship an SBOM per archive and a checksums
# file that the Homebrew formula and the npm shim pin.
version: 2

project_name: iugu

before:
  hooks:
    - go mod tidy
    - ./scripts/completions.sh

builds:
  - id: iugu
    main: ./cmd/iugu
    binary: iugu
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/iugu-private/platform2-cli/internal/cli.Version={{ .Version }}
      - -X github.com/iugu-private/platform2-cli/internal/cli.Commit={{ .ShortCommit }}
      - -X github.com/iugu-private/platform2-cli/internal/cli.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - src: build/completions/*
        dst: completions
        strip_parent: true

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    args: [sign-blob, "--yes", "--output-certificate=${certificate}", "--output-signature=${signature}", "${artifact}"]
    artifacts: checksum

snapshot:
  version_template: "{{ incpatch .Version }}-next+{{ .ShortCommit }}"

changelog:
  use: git
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]

release:
  github:
    owner: iugu-private
    name: platform2-cli
  draft: true
  prerelease: auto
  footer: |
    ## Install
    ```
    brew install iugu-private/tap/iugu
    curl -fsSL https://raw.githubusercontent.com/iugu-private/platform2-cli/main/install.sh | sh
    npx @iugu/cli --help
    ```
    Verify: `cosign verify-blob --certificate checksums.txt.pem --signature checksums.txt.sig --certificate-identity-regexp 'github.com/iugu-private/platform2-cli' --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt`

homebrew_casks:
  - name: iugu
    repository:
      owner: iugu-private
      name: homebrew-tap
      branch: main
    directory: Casks
    homepage: https://developer.iugu.com/console/cli
    description: Platform 2 Console CLI for developers and their AI agents
    license: MIT
    binaries: [iugu]
    completions:
      bash: completions/iugu.bash
      zsh: completions/_iugu
      fish: completions/iugu.fish
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/iugu"]
          end

scoops:
  - name: iugu
    repository:
      owner: iugu-private
      name: scoop-bucket
    homepage: https://developer.iugu.com/console/cli
    description: Platform 2 Console CLI for developers and their AI agents
    license: MIT
